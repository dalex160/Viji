name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: UNIVERSAL=1 INSTALL=0 VERSION="${GITHUB_REF_NAME#v}" zsh build.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Viji.app Viji.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Viji.zip --title "Viji $GITHUB_REF_NAME" --generate-notes
